name: Build and Deploy

# テスト → ビルド → 写真の読み取りソフトを用意 → 全ページ点検 →（PRでは写真の読み取りのテスト）→ Cloudflare Pages へ直接アップロード（Direct Upload）
# →（本番では）変わったページを IndexNow で検索エンジンに知らせる
# Cloudflare 側ではビルドしないので、アカウント共有の「月500回のビルド枠」を使わない
#   main への push        → 本番（https://sakutto-keisan.com）
#   プルリクエスト        → プレビュー（PRにURLをコメント）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: sakutto-keisan

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: 写真の読み取りソフトを用意（Tesseract.js・日本語のデータ）
        run: node scripts/fetch-ocr.mjs

      - name: 全ページ点検
        run: npm run verify

      - name: 写真の読み取りのテスト（プルリクエストのとき）
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/ocr-smoke.mjs

      - name: 検索エンジンに知らせるページをえらぶ（本番のとき）
        # 本番にある前回の指紋とくらべて、中身が変わったページ・新しいページだけをえらぶ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs prepare

      - name: Cloudflare Pages へアップロード
        # フォークからのPRには秘密情報が渡らないので、アップロードしない
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          # 初回だけ Pages のプロジェクトを作る（すでにあれば何もしない）
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | sort -u > urls.txt || true
          {
            echo "### Cloudflare Pages（$BRANCH）"
            sed 's/^/- /' urls.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 検索エンジンに知らせる（IndexNow・本番のとき）
        # Bing・Yandex・Naver・Seznam・Yep に、変わったページだけを知らせる。失敗しても公開は止めない
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs send

      - name: PRにプレビューURLをコメント
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ALIAS=$(grep -v -E '^https://[0-9a-f]{8}\.' urls.txt | head -1)
          [ -n "$ALIAS" ] || ALIAS=$(head -1 urls.txt)
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🔍 プレビュー：$ALIAS
          （コミット ${SHA::7}。このブランチに push するたびに同じURLが新しくなります）"

name: Henreihin check

# 返礼品が楽天の商品検索で取れるか（件数・ふるさと納税の店・ジャンルIDだけ。商品の情報は出さない）
# キーが入った日に手で1回と、返礼品の探し方（言葉・ジャンルID・量の読み方）を変えたPRで動く
# 結果は注意書き（Annotations）に出る。scripts/check-henreihin.mjs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/data/henreihin.mjs
      - src/lib/henreihin.mjs
      - scripts/rakuten.mjs
      - scripts/check-henreihin.mjs
      - .github/workflows/henreihin-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # フォークからのPRには秘密情報が渡らないので動かさない
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 楽天に聞く
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/check-henreihin.mjs

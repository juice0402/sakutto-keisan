name: Watch official pages

# 公式のページの見張り（scripts/watch-pages.mjs）。変わったら Issue「【夜】…」を立てる（ラベル night。毎晩の夜のまとめ作業が直す）
#   3時間おき：お買い物マラソンの公式のページ（日付・時刻・ポイント・倍の数字だけをくらべる）
#   毎日（朝6:53）：SPU の公式のページ（日付・ポイント・円・倍の数字だけをくらべる）
#   週1回（月曜の朝）：ふるさと納税の出典のページ（本文の指紋だけをくらべる）
# 前回の数字はキャッシュに置く（リポジトリには入れない）。公式の文は保存しない・Issue にも貼らない
# 同じ見張りの Issue が開いているあいだは、新しい Issue を立てずにコメントを足す

on:
  schedule:
    - cron: '23 */3 * * *'
    - cron: '41 21 * * 0'
    - cron: '53 21 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'point・spu・furusato のどれか'
        required: true
        default: point

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-${{ github.event.schedule || inputs.group }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: どれを見るか
        id: g
        run: |
          if [ "${{ github.event.schedule }}" = "41 21 * * 0" ]; then g=furusato
          elif [ "${{ github.event.schedule }}" = "53 21 * * *" ]; then g=spu
          elif [ -n "${{ inputs.group }}" ]; then g="${{ inputs.group }}"
          else g=point; fi
          echo "group=$g" >> "$GITHUB_OUTPUT"

      - name: 前回の数字
        uses: actions/cache/restore@v4
        with:
          path: .watch
          key: watch-${{ steps.g.outputs.group }}-${{ github.run_id }}
          restore-keys: watch-${{ steps.g.outputs.group }}-

      - name: 公式のページを見る
        run: node scripts/watch-pages.mjs ${{ steps.g.outputs.group }}

      - name: 今回の数字を残す
        uses: actions/cache/save@v4
        with:
          path: .watch
          key: watch-${{ steps.g.outputs.group }}-${{ github.run_id }}

      - name: 変わっていたら Issue
        if: hashFiles('watch-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ steps.g.outputs.group }}
        # 夜のまとめ作業が直せるように、ラベル night・題「【夜】…」・本文は夜のメモ＋報告（scripts/mihari.mjs memo）
        # 開いている同じ見張りの Issue（前の題のものもふくむ）があれば、night を付けてコメントを足す
        run: |
          case "$GROUP" in
            point) old='お買い物マラソンの公式のページが変わりました' ;;
            spu) old='SPUの公式のページが変わりました' ;;
            *) old='ふるさと納税の出典のページが変わりました' ;;
          esac
          title="【夜】$old"
          gh label create night --color 5319e7 --description "夜のまとめ作業が直す" 2>/dev/null || true
          open=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\" or .title == \"$old\"))[0].number // empty")
          if [ -n "$open" ]; then
            gh issue edit "$open" --add-label night
            gh issue comment "$open" --body-file watch-report.md
          else
            node scripts/mihari.mjs memo "watch-$GROUP" watch-report.md > issue.md
            gh issue create --title "$title" --label night --body-file issue.md
          fi
